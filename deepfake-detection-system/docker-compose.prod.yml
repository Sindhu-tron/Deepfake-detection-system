services:
  # Redis for Caching
  redis:
    image: redis:7-alpine
    container_name: deepfake_redis_prod
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - deepfake_network

  # Main API Service
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: deepfake_api_prod
    environment:
      - FLASK_ENV=production
      - MODEL_PATH=/app/models/best_model.h5
      - REDIS_URL=redis://redis:6379/0
      - WORKERS=4
    ports:
      - "5001:5001"
    volumes:
      - ./training_outputs/models:/app/models:ro
    depends_on:
      - redis
    networks:
      - deepfake_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Web Application
  webapp:
    build:
      context: .
      dockerfile: docker/Dockerfile.webapp
    container_name: deepfake_webapp_prod
    environment:
      - FLASK_ENV=production
      - API_URL=http://api:5001
    ports:
      - "5000:5000"
    depends_on:
      - api
    networks:
      - deepfake_network
    restart: always

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: deepfake_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - webapp
      - api
    networks:
      - deepfake_network
    restart: always

volumes:
  redis_data:

networks:
  deepfake_network:
    driver: bridge