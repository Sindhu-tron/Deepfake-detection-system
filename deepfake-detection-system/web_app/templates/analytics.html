<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepfake Detection Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f6fa;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .stat-label {
            color: #666;
            font-size: 1.1em;
        }
        
        .chart-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .chart-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #333;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Deepfake Detection Analytics</h1>
            <p>System performance and usage statistics</p>
        </div>
        
        <div class="stats-grid" id="statsGrid">
            <div class="loading">Loading analytics...</div>
        </div>
        
        <div class="chart-container">
            <div class="chart-title">Predictions Timeline (Last 7 Days)</div>
            <canvas id="timelineChart"></canvas>
        </div>
        
        <div class="chart-container">
            <div class="chart-title">Detection Distribution</div>
            <canvas id="distributionChart"></canvas>
        </div>
    </div>

    <script>
        // Load analytics data
        async function loadAnalytics() {
            try {
                // Load summary stats
                const summaryResponse = await fetch('/api/analytics/summary');
                const summaryData = await summaryResponse.json();
                
                if (summaryData.success) {
                    displayStats(summaryData.data);
                    createDistributionChart(summaryData.data);
                }
                
                // Load timeline data
                const timelineResponse = await fetch('/api/analytics/predictions/timeline');
                const timelineData = await timelineResponse.json();
                
                if (timelineData.success) {
                    createTimelineChart(timelineData.data);
                }
                
            } catch (error) {
                console.error('Error loading analytics:', error);
                document.getElementById('statsGrid').innerHTML = 
                    '<div class="loading">Error loading analytics data</div>';
            }
        }
        
        function displayStats(data) {
            const statsGrid = document.getElementById('statsGrid');
            
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${data.total_predictions || 0}</div>
                    <div class="stat-label">Total Predictions</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${data.fake_predictions || 0}</div>
                    <div class="stat-label">Deepfakes Detected</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${data.real_predictions || 0}</div>
                    <div class="stat-label">Real Images</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${(data.fake_detection_rate || 0).toFixed(1)}%</div>
                    <div class="stat-label">Deepfake Rate</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${data.recent_predictions_24h || 0}</div>
                    <div class="stat-label">Last 24 Hours</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${data.total_api_calls || 0}</div>
                    <div class="stat-label">API Calls</div>
                </div>
            `;
        }
        
        function createTimelineChart(data) {
            const ctx = document.getElementById('timelineChart').getContext('2d');
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.date),
                    datasets: [
                        {
                            label: 'Real Images',
                            data: data.map(d => d.real),
                            borderColor: '#27ae60',
                            backgroundColor: 'rgba(39, 174, 96, 0.1)',
                            tension: 0.4
                        },
                        {
                            label: 'Deepfakes',
                            data: data.map(d => d.fake),
                            borderColor: '#e74c3c',
                            backgroundColor: 'rgba(231, 76, 60, 0.1)',
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }
        
        function createDistributionChart(data) {
            const ctx = document.getElementById('distributionChart').getContext('2d');
            
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Real Images', 'Deepfakes'],
                    datasets: [{
                        data: [data.real_predictions || 0, data.fake_predictions || 0],
                        backgroundColor: ['#27ae60', '#e74c3c'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }
        
        // Load analytics on page load
        loadAnalytics();
        
        // Refresh every 30 seconds
        setInterval(loadAnalytics, 30000);
    </script>
</body>
</html>
