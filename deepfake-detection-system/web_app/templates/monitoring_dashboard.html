<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Monitoring Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: white;
            padding: 20px;
        }
        
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .metric-card {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .metric-title {
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 10px;
        }
        
        .metric-value {
            font-size: 2em;
            font-weight: bold;
            color: #fff;
        }
        
        .metric-chart {
            height: 60px;
            margin-top: 10px;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-healthy { background: #4CAF50; }
        .status-degraded { background: #FF9800; }
        .status-unhealthy { background: #F44336; }
        
        .chart-container {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .chart-title {
            font-size: 1.2em;
            margin-bottom: 15px;
            color: #fff;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #aaa;
        }
        
        .error-log {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .error-entry {
            padding: 10px;
            margin: 5px 0;
            background: #3d1a1a;
            border-left: 3px solid #F44336;
            border-radius: 4px;
        }
        
        .error-time {
            font-size: 0.8em;
            color: #aaa;
        }
        
        .error-message {
            margin-top: 5px;
            color: #ffcccb;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>Deepfake Detection System Monitor</h1>
            <p>Real-time system performance and health monitoring</p>
        </div>
        
        <div class="metrics-grid" id="metricsGrid">
            <div class="loading">Loading system metrics...</div>
        </div>
        
        <div class="chart-container">
            <div class="chart-title">System Resource Usage</div>
            <canvas id="resourceChart"></canvas>
        </div>
        
        <div class="chart-container">
            <div class="chart-title">Performance Timeline</div>
            <canvas id="timelineChart"></canvas>
        </div>
        
        <div class="error-log">
            <div class="chart-title">Recent System Events</div>
            <div id="errorLog">
                <div class="loading">Loading events...</div>
            </div>
        </div>
    </div>

    <script>
        let resourceChart, timelineChart;
        let metricsHistory = [];
        
        // Initialize dashboard
        async function initDashboard() {
            await loadMetrics();
            createCharts();
            
            // Update every 5 seconds
            setInterval(async () => {
                await loadMetrics();
                updateCharts();
            }, 5000);
        }
        
        async function loadMetrics() {
            try {
                // Load current metrics
                const metricsResponse = await fetch('/api/monitoring/metrics');
                const metricsData = await metricsResponse.json();
                
                // Load health status
                const healthResponse = await fetch('/api/monitoring/health');
                const healthData = await healthResponse.json();
                
                if (metricsData.success && healthData.success) {
                    updateMetricsDisplay(metricsData.metrics, healthData.health);
                    
                    // Store metrics for charts
                    metricsHistory.push({
                        timestamp: new Date(),
                        ...metricsData.metrics
                    });
                    
                    // Keep only last 20 data points
                    if (metricsHistory.length > 20) {
                        metricsHistory.shift();
                    }
                }
                
            } catch (error) {
                console.error('Error loading metrics:', error);
            }
        }
        
        function updateMetricsDisplay(metrics, health) {
            const grid = document.getElementById('metricsGrid');
            
            // Determine status color
            let statusClass = 'status-healthy';
            if (health.status === 'degraded') statusClass = 'status-degraded';
            if (health.status === 'unhealthy') statusClass = 'status-unhealthy';
            
            grid.innerHTML = `
                <div class="metric-card">
                    <div class="metric-title">System Status</div>
                    <div class="metric-value">
                        <span class="status-indicator ${statusClass}"></span>
                        ${health.status.toUpperCase()}
                    </div>
                    <div style="margin-top: 10px; font-size: 0.9em; color: #aaa;">
                        Health Score: ${health.health_score}/100
                    </div>
                </div>
                
                <div class="metric-card">
                    <div class="metric-title">CPU Usage</div>
                    <div class="metric-value">${metrics.cpu_percent.toFixed(1)}%</div>
                </div>
                
                <div class="metric-card">
                    <div class="metric-title">Memory Usage</div>
                    <div class="metric-value">${metrics.memory_percent.toFixed(1)}%</div>
                    <div style="margin-top: 5px; font-size: 0.8em; color: #aaa;">
                        ${metrics.memory_available_gb.toFixed(1)}GB / ${metrics.memory_total_gb.toFixed(1)}GB
                    </div>
                </div>
                
                <div class="metric-card">
                    <div class="metric-title">Disk Usage</div>
                    <div class="metric-value">${metrics.disk_usage.toFixed(1)}%</div>
                </div>
                
                <div class="metric-card">
                    <div class="metric-title">Errors (Last Hour)</div>
                    <div class="metric-value">${health.error_summary.errors_last_hour}</div>
                </div>
                
                <div class="metric-card">
                    <div class="metric-title">Total Errors</div>
                    <div class="metric-value">${health.error_summary.total_errors}</div>
                </div>
            `;
        }
        
        function createCharts() {
            // Resource usage chart
            const resourceCtx = document.getElementById('resourceChart').getContext('2d');
            resourceChart = new Chart(resourceCtx, {
                type: 'doughnut',
                data: {
                    labels: ['CPU', 'Memory', 'Disk'],
                    datasets: [{
                        data: [0, 0, 0],
                        backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            labels: {
                                color: 'white'
                            }
                        }
                    }
                }
            });
            
            // Timeline chart
            const timelineCtx = document.getElementById('timelineChart').getContext('2d');
            timelineChart = new Chart(timelineCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: 'CPU %',
                            data: [],
                            borderColor: '#FF6384',
                            backgroundColor: 'rgba(255, 99, 132, 0.1)',
                            tension: 0.4
                        },
                        {
                            label: 'Memory %',
                            data: [],
                            borderColor: '#36A2EB',
                            backgroundColor: 'rgba(54, 162, 235, 0.1)',
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            grid: {
                                color: '#444'
                            },
                            ticks: {
                                color: 'white'
                            }
                        },
                        x: {
                            grid: {
                                color: '#444'
                            },
                            ticks: {
                                color: 'white'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: {
                                color: 'white'
                            }
                        }
                    }
                }
            });
        }
        
        function updateCharts() {
            if (metricsHistory.length === 0) return;
            
            const latest = metricsHistory[metricsHistory.length - 1];
            
            // Update resource chart
            resourceChart.data.datasets[0].data = [
                latest.cpu_percent,
                latest.memory_percent,
                latest.disk_usage
            ];
            resourceChart.update('none');
            
            // Update timeline chart
            timelineChart.data.labels = metricsHistory.map(m => 
                m.timestamp.toLocaleTimeString()
            );
            timelineChart.data.datasets[0].data = metricsHistory.map(m => m.cpu_percent);
            timelineChart.data.datasets[1].data = metricsHistory.map(m => m.memory_percent);
            timelineChart.update('none');
        }
        
        // Start dashboard
        initDashboard();
    </script>
</body>
</html>
